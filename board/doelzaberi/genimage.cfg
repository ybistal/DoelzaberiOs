image efi-part.vfat {
	vfat {
		file boot/bzImage { image = "bzImage" }
		file boot/initrd { image = "rootfs.cpio" }
		file EFI/BOOT/BOOTX64.EFI { image = "efi-part/EFI/BOOT/bootx64.efi" }
		file EFI/BOOT/grub.cfg { image = "grub-esp.cfg" }
	}
	size = 2G
}

image sdcard.img {
	hdimage {
		partition-table-type = "gpt"
	}

	partition EFI {
		partition-type-uuid = c12a7328-f81f-11d2-ba4b-00a0c93ec93b
		image = "efi-part.vfat"
		offset = 1M
	}

	partition rootfs {
		partition-type-uuid = 0fc63daf-8483-4772-8e79-3d69d8477de4
		partition-uuid = 44444444-4444-4444-8444-444444444444
		image = "rootfs.btrfs"
	}
}
